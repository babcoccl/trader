oss keeps growing. Volatility-target sizing means the position is cut when BTC and ETH swing more than usual; "40%" is the yearly swing the position is sized to. The bad case is the 10th percentile of 3,000 resampled three-year paths built from 2022-2026 returns. Replaying the halt rule on history with a 30-day pause changed returns by a few points in either direction with no pattern, so the halt is insurance, not a source of return.</span></div><div class="flex flex-col gap-3"><span class="font-semibold">2. Funding carry: about equal to Treasury bills since 2022</span><div class="text-12 relative flex w-full justify-center [&amp;_.recharts-wrapper]:size-full [&amp;_.recharts-cartesian-axis-tick-value[fill='#666']]:fill-[rgb(var(--text-secondary))] [&amp;_.recharts-cartesian-axis-tick-line[stroke='#666']]:stroke-[rgb(var(--border-secondary))] [&amp;_.recharts-cartesian-axis-line[stroke='#666']]:stroke-[rgb(var(--border-secondary))] [&amp;_.recharts-cartesian-grid-horizontal_line[stroke='#ccc']]:stroke-[rgb(var(--tint-tertiary))] [&amp;_.recharts-cartesian-grid-horizontal_line[stroke='#ccc']]:[stroke-dasharray:2_2] [&amp;_.recharts-cartesian-grid-vertical_line[stroke='#ccc']]:stroke-[rgb(var(--tint-tertiary))] [&amp;_.recharts-cartesian-grid-vertical_line[stroke='#ccc']]:[stroke-dasharray:2_2] [&amp;_.recharts-tooltip-cursor[fill='#ccc']]:fill-[rgb(var(--tint-tertiary))] [&amp;_.recharts-curve.recharts-tooltip-cursor[stroke='#ccc']]:stroke-[rgb(var(--border-secondary))] [&amp;_.recharts-polar-grid_[stroke='#ccc']]:stroke-[rgb(var(--border-primary))] [&amp;_.recharts-polar-radius-axis-line[stroke='#ccc']]:stroke-[rgb(var(--border-secondary))] [&amp;_.recharts-polar-radius-axis-tick-value[fill='#ccc']]:fill-[rgb(var(--text-secondary))] [&amp;_.recharts-polar-angle-axis-tick-value[fill='#808080']]:fill-[rgb(var(--text-secondary))] [&amp;_.recharts-label[fill='#808080']]:fill-[rgb(var(--text-secondary))] [&amp;_.recharts-reference-line-line[stroke='#ccc']]:stroke-[rgb(va

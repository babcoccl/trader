services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
      # Dashboard password; comes from the host environment or .env.
      TRADER_DASHBOARD_PASSWORD: ${TRADER_DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn trader.api.app:app --host 0.0.0.0 --port 8000

  collector:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.data.collector

  engine:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.engine

  executor:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.execution

  watchdog:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.ops

  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  db-data:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
      TRADER_VENUE: ${TRADER_VENUE:-bitstamp}
      TRADER_COINBASE_KEY: ${TRADER_COINBASE_KEY:-}
      TRADER_COINBASE_SECRET: ${TRADER_COINBASE_SECRET:-}
      TRADER_COINBASE_BASE_URL: ${TRADER_COINBASE_BASE_URL:-https://api.coinbase.com}
      TRADER_SUBSIDY_ENABLED: ${TRADER_SUBSIDY_ENABLED:-false}
      TRADER_SUBSIDY_TARGET_VOLUME_USD: ${TRADER_SUBSIDY_TARGET_VOLUME_USD:-10000}
      TRADER_SUBSIDY_DAILY_CAP_USD: ${TRADER_SUBSIDY_DAILY_CAP_USD:-2000}
      TRADER_SUBSIDY_ADX_MAX: ${TRADER_SUBSIDY_ADX_MAX:-20}
      TRADER_SUBSIDY_ORDER_NOTIONAL_USD: ${TRADER_SUBSIDY_ORDER_NOTIONAL_USD:-250}
      TRADER_SUBSIDY_ORDER_LEVELS: ${TRADER_SUBSIDY_ORDER_LEVELS:-2}
      TRADER_SUBSIDY_SPREAD_BPS: ${TRADER_SUBSIDY_SPREAD_BPS:-5.0}
      TRADER_SUBSIDY_REFRESH_SECONDS: ${TRADER_SUBSIDY_REFRESH_SECONDS:-20}
      # Dashboard password; comes from the host environment or .env.
      TRADER_DASHBOARD_PASSWORD: ${TRADER_DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn trader.api.app:app --host 0.0.0.0 --port 8000

  collector:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.data.collector

  engine:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
      TRADER_STRATEGY: ${TRADER_STRATEGY:-trend}
      TRADER_VENUE: ${TRADER_VENUE:-bitstamp}
      TRADER_SUBSIDY_ENABLED: ${TRADER_SUBSIDY_ENABLED:-false}
      TRADER_SUBSIDY_TARGET_VOLUME_USD: ${TRADER_SUBSIDY_TARGET_VOLUME_USD:-10000}
      TRADER_SUBSIDY_DAILY_CAP_USD: ${TRADER_SUBSIDY_DAILY_CAP_USD:-2000}
      TRADER_SUBSIDY_ADX_MAX: ${TRADER_SUBSIDY_ADX_MAX:-20}
      TRADER_SUBSIDY_ORDER_NOTIONAL_USD: ${TRADER_SUBSIDY_ORDER_NOTIONAL_USD:-250}
      TRADER_AUTO_APPROVE_ENABLED: ${TRADER_AUTO_APPROVE_ENABLED:-false}
      TRADER_AUTO_APPROVE_MAX_NOTIONAL_USD: ${TRADER_AUTO_APPROVE_MAX_NOTIONAL_USD:-750}
      TRADER_AUTO_APPROVE_MAX_LOSS_PCT: ${TRADER_AUTO_APPROVE_MAX_LOSS_PCT:-0.015}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.engine

  executor:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
      TRADER_VENUE: ${TRADER_VENUE:-bitstamp}
      TRADER_COINBASE_KEY: ${TRADER_COINBASE_KEY:-}
      TRADER_COINBASE_SECRET: ${TRADER_COINBASE_SECRET:-}
      TRADER_COINBASE_BASE_URL: ${TRADER_COINBASE_BASE_URL:-https://api.coinbase.com}
      TRADER_SUBSIDY_ENABLED: ${TRADER_SUBSIDY_ENABLED:-false}
      TRADER_SUBSIDY_TARGET_VOLUME_USD: ${TRADER_SUBSIDY_TARGET_VOLUME_USD:-10000}
      TRADER_SUBSIDY_DAILY_CAP_USD: ${TRADER_SUBSIDY_DAILY_CAP_USD:-2000}
      TRADER_SUBSIDY_ADX_MAX: ${TRADER_SUBSIDY_ADX_MAX:-20}
      TRADER_SUBSIDY_ORDER_NOTIONAL_USD: ${TRADER_SUBSIDY_ORDER_NOTIONAL_USD:-250}
      TRADER_SUBSIDY_ORDER_LEVELS: ${TRADER_SUBSIDY_ORDER_LEVELS:-2}
      TRADER_SUBSIDY_SPREAD_BPS: ${TRADER_SUBSIDY_SPREAD_BPS:-5.0}
      TRADER_SUBSIDY_REFRESH_SECONDS: ${TRADER_SUBSIDY_REFRESH_SECONDS:-20}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.execution

  watchdog:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: ${TRADER_MODE:-paper}
      TRADER_LOG_LEVEL: INFO
      TRADER_SYMBOLS: ${TRADER_SYMBOLS:-BTC-USD,ETH-USD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m trader.ops

  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  db-data:

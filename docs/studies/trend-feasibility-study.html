<div id="root"><div class="flex flex-col gap-6"><header class="inline-hidden flex items-start justify-between gap-4"><div class="flex flex-col gap-1"><h1 class="text-[20px] font-semibold text-text-primary">Feasibility study: trend-following sleeve</h1><p class="text-[14px] text-text-secondary">Do simple trend rules beat holding cash and holding coins after real fees, on data they were not tuned on? Daily data, April 2018 to 19 November 2026.</p></div><button type="button" tabindex="0" aria-label="Switch to dark mode" id="base-ui-_r_2_" data-base-ui-tooltip-trigger="" data-tooltip-trigger="" class="inline-flex touch-manipulation select-none items-center justify-center outline-none [-webkit-touch-callout:none] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 shrink-0 focus-ring bg-transparent text-text-secondary hover:bg-tint-secondary hover:text-text-primary data-[pressed]:bg-tint-secondary data-[pressed]:text-text-primary rounded-[6px] size-7 [&amp;_svg]:size-[18px]"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></button></header><div class="border-border-secondary bg-bg-elevated light:bg-clip-padding relative w-full overflow-clip rounded-[6px] border"><div class="absolute left-0 top-0 h-full w-[5px] bg-blue"></div><div class="flex gap-3 px-4 py-3 items-center flex-wrap"><div class="flex flex-1 flex-col gap-1.5 min-w-[min(100%,16rem)]"><div class="flex items-center gap-1.5"><p title="Verdict: build a small version, and expect modest returns" class="text-14 text-text-primary font-medium">Verdict: build a small version, and expect modest returns</p></div><p class="text-13 text-text-secondary">Trend rules on BTC and ETH returned 36% a year over 2018-2026 against 29% for holding BTC, and cut the worst loss from 77% to 47%. Sized to stay inside your 15% drawdown limit, that is about 10% a year over the whole period and about 4% a year since 2022. The result since 2022 is not statistically distinguishable from zero. Adding alt-coins, shorting, and using perpetuals for long positions each made results worse or riskier.</p></div></div></div><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[14px] p-1"><div class="grid gap-1 grid-cols-[repeat(auto-fit,minmax(128px,1fr))]"><div class="flex w-full min-w-[128px] flex-col gap-1 rounded-[10px] px-4 py-3 text-left"><span class="flex min-w-0 items-center gap-1"><span class="text-12 font-medium text-text-secondary">Trend rules, yearly return since 2022</span></span><div class="contents select-text"><span class="text-17 font-medium text-text-primary min-w-0 select-text truncate">11.5%</span><span class="text-12 font-regular text-text-secondary block min-w-0 select-text whitespace-normal break-words">Buy and hold BTC: 5.5%</span></div></div><div class="flex w-full min-w-[128px] flex-col gap-1 rounded-[10px] px-4 py-3 text-left"><span class="flex min-w-0 items-center gap-1"><span class="text-12 font-medium text-text-secondary">Worst loss from a peak, 2018-2026</span></span><div class="contents select-text"><span class="text-17 font-medium text-text-primary min-w-0 select-text truncate">-47%</span><span class="text-12 font-regular text-text-secondary block min-w-0 select-text whitespace-normal break-words">Buy and hold BTC: -77%</span></div></div><div class="flex w-full min-w-[128px] flex-col gap-1 rounded-[10px] px-4 py-3 text-left"><span class="flex min-w-0 items-center gap-1"><span class="text-12 font-medium text-text-secondary">Yearly return at 15%-limit sizing</span></span><div class="contents select-text"><span class="text-17 font-medium text-text-primary min-w-0 select-text truncate">4.0% to 10.3%</span><span class="text-12 font-regular text-text-secondary block min-w-0 select-text whitespace-normal break-words">$198 to $514 a year on $5,000</span></div></div><div class="flex w-full min-w-[128px] flex-col gap-1 rounded-[10px] px-4 py-3 text-left"><span class="flex min-w-0 items-center gap-1"><span class="text-12 font-medium text-text-secondary">Chance the post-2022 return is above zero</span></span><div class="contents select-text"><span class="text-17 font-medium text-text-primary min-w-0 select-text truncate">85%</span><span class="text-12 font-regular text-text-secondary block min-w-0 select-text whitespace-normal break-words">Bootstrap estimate; 95% is the usual bar for calling an edge proven</span></div></div></div></div></div><div class="flex flex-col gap-3"><span class="font-semibold">What was tested</span><span class="text-13 font-regular text-secondary">Nine textbook trend rules (price above its 50, 100 or 200-day average; positive 30, 90 or 180-day return; 20, 55 or 100-day breakout) and their plain average, which is the headline strategy. No parameter was tuned. Signals use data up to each day's close and fill at the next day's open, with the venue fee plus 0.05% slippage per side. Long only, no leverage. The alt-coin universes are rebuilt each month from the previous 90 days of trading volume and include coins that later collapsed or were delisted. Unless a venue is named, figures use a 0.40% fee per side.</span></div><div class="flex flex-col gap-3"><span class="font-semibold">Growth of $1 and losses from the peak</span><div data-orientation="horizontal" role="group" class="flex select-none items-center gap-px rounded-[7px] bg-tint-tertiary light:bg-clip-padding high-contrast:border-border-secondary border border-transparent dark:bg-clip-border"><button type="button" data-pressed="" aria-disabled="false" tabindex="0" aria-pressed="true" class="text-text-secondary flex items-center justify-center border border-transparent font-normal text-13 px-3 py-1 rounded-[6px] hover:enabled:tex

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:trader@db:5432/trader
      TRADER_MODE: paper
      TRADER_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn trader.api.app:app --host 0.0.0.0 --port 8000

volumes:
  db-data:
